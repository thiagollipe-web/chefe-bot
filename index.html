<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f1"><link rel="manifest" href="./manifest.webmanifest"><title>Chef-Bot — IA Local</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff8f1;color:#241f1a}main{width:min(980px,100%);margin:auto;padding:16px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:#241f1a;color:#fff;display:grid;place-items:center;font-size:25px}h1,h2,h3,p{margin:0}.brand p,.hero p,.ai small{color:#786d62;font-size:.9rem}.ai{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.progress{height:7px;background:#eee5dc;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#241f1a}.ai button,.send,.chips button{border:0;border-radius:12px;padding:10px 14px;background:#241f1a;color:#fff;font-weight:700;cursor:pointer}.hero{display:flex;gap:16px;align-items:center;background:#241f1a;color:#fff;border-radius:22px;padding:18px;margin-bottom:14px}.hero p{color:#d6cbc1;margin-top:4px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{background:#fff;color:#241f1a;border:1px solid #dfd4ca;font-weight:600}.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:100px}.message{display:flex;flex-direction:column;gap:8px;max-width:92%}.message.user{align-self:flex-end}.bubble{padding:11px 14px;border-radius:16px;background:#fff;border:1px solid #e7ddd2;line-height:1.45}.user .bubble{background:#241f1a;color:#fff;border-color:#241f1a}.recipe{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:14px;display:flex;gap:12px}.emoji{font-size:34px}.recipe-main{flex:1}.meta,.actions,.ing-list{display:flex;gap:8px;flex-wrap:wrap}.meta{margin:5px 0;color:#786d62;font-size:.84rem}.ing{font-size:.82rem;padding:5px 8px;border-radius:9px;background:#f3eee8}.miss{opacity:.55}.actions{margin-top:10px}.actions button{border:0;border-radius:10px;padding:8px 10px;cursor:pointer}.primary{background:#241f1a;color:#fff}.heart{background:#f3eee8}.steps{margin:12px 0 0 20px;line-height:1.55}.inputbar{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(948px,calc(100% - 24px));display:flex;gap:8px;background:#fff8f1;padding:8px;border:1px solid #e7ddd2;border-radius:18px;box-shadow:0 12px 40px rgba(36,31,26,.12)}input{flex:1;border:1px solid #dfd4ca;border-radius:12px;padding:13px;background:#fff;font-size:16px;outline:none}.send{min-width:52px}@media(max-width:600px){main{padding:10px}.hero{padding:14px}.recipe{padding:12px}.ai{align-items:flex-start;flex-direction:column}.ai button{width:100%}}</style></head><body><main><header><div class="brand"><div class="logo">🍳</div><div><h1>Chef-Bot</h1><p>Receitas com inteligência local</p></div></div><div id="favCount">0 ♥</div></header><section class="ai"><div><strong id="aiStatus">IA local pronta para carregar</strong><small id="backend"></small><div class="progress"><i id="bar"></i></div></div><button id="loadAI">Carregar IA local</button></section><section class="hero"><div style="font-size:48px">👨‍🍳</div><div><h2>O que temos na cozinha?</h2><p>A busca local funciona sem IA. A IA interpreta sua intenção quando carregada.</p></div></section><div class="chips" id="chips"></div><section class="chat" id="chat"></section><div class="inputbar"><input id="input" placeholder="Ex.: tenho ovo, queijo e pão..."><button class="send" id="send">➤</button></div></main><script type="module">
const DATA="1§Ovo Mexido Cremoso§🍳§5§Fácil§ovo¤manteiga¤leite¤sal§Derreta manteiga em fogo baixo.¦Quebre os ovos e mexa sem parar.¦Adicione leite, sal e finalize cremoso.§rápido¤café~2§Misto Quente Turbo§🥪§8§Fácil§pão¤queijo¤presunto¤manteiga§Passe manteiga fora do pão.¦Recheie com queijo e presunto.¦Doure na frigideira 3 min cada lado.§lanche~3§Omelete de Queijo§🧀§7§Fácil§ovo¤queijo¤sal¤óleo§Bata ovos com sal.¦Despeje na frigideira com óleo.¦Recheie com queijo e dobre.§café¤rápido~4§Pão com Ovo Crocante§🍞§10§Fácil§pão¤ovo¤manteiga¤sal§Toste o pão na manteiga.¦Frite o ovo com gema mole.¦Monte e tempere.§café~5§Macarrão Alho e Óleo§🍝§12§Fácil§macarrão¤alho¤azeite¤sal§Cozinhe macarrão al dente.¦Frite alho no azeite.¦Misture tudo.§almoço¤rápido~6§Arroz de Forno Preguiçoso§🍚§15§Fácil§arroz¤queijo¤presunto¤tomate¤manteiga§Misture arroz cozido com tudo.¦Coloque em refratário.¦Gratine 8 min.§almoço~7§Tapioca de Queijo§🫓§6§Fácil§tapioca¤queijo¤manteiga§Aqueça frigideira.¦Espalhe tapioca.¦Recheie com queijo.§café¤sem glúten~8§Bruschetta de Tomate§🍅§10§Fácil§pão¤tomate¤alho¤azeite¤sal§Toste pão com alho.¦Pique tomate com azeite e sal.¦Cubra as torradas.§lanche~9§Panqueca Simples§🥞§12§Médio§ovo¤leite¤farinha¤manteiga¤sal§Bata tudo no liquidificador.¦Frite discos finos.¦Recheie como quiser.§café¤lanche~10§Farofa de Ovo§🍳§8§Fácil§ovo¤farinha¤manteiga¤cebola¤sal§Doure cebola na manteiga.¦Entre com ovo mexido.¦Jogue farinha até dourar.§acompanhamento~11§Cuscuz de Micro-ondas§🌽§5§Fácil§flocão¤água¤sal¤manteiga§Hidrate flocão 3 min.¦Leve ao micro 2 min.¦Solte com manteiga.§café¤nordeste~12§Sanduíche Natural§🥬§7§Fácil§pão¤frango¤maionese¤alface¤tomate§Desfie frango e misture com maionese.¦Monte no pão com salada.¦Corte ao meio.§lanche~13§Miojo Gourmet§🍜§10§Fácil§macarrão instantâneo¤ovo¤cebolinha¤manteiga§Cozinhe miojo com menos água.¦Finalize com ovo e manteiga.¦Salpique cebolinha.§rápido¤lanche~14§Ovos no Purgatório§🔥§12§Médio§ovo¤tomate¤alho¤azeite¤sal§Faça molho rápido de tomate.¦Abra covinhas e quebre ovos.¦Tampe até firmar.§almoço¤café~15§Queijo Quente com Tomate§🧀§9§Fácil§pão¤queijo¤tomate¤manteiga¤orégano§Recheie pão com queijo e tomate.¦Tempere com orégano.¦Toste na manteiga.§lanche~16§Arroz com Ovo Douradinho§🍚§8§Fácil§arroz¤ovo¤alho¤óleo¤sal§Frite alho.¦Entre com arroz cozido.¦Puxe com ovo mexido.§almoço~17§Crepioca Fit§💪§6§Fácil§ovo¤tapioca¤queijo¤sal§Bata ovo com tapioca.¦Frite em frigideira antiaderente.¦Recheie com queijo.§café¤fit~18§Pão de Queijo de Frigideira§🧀§7§Fácil§tapioca¤queijo¤ovo¤sal§Misture tudo.¦Espalhe na frigideira.¦Doure dos dois lados.§café~19§Macarrão na Manteiga§🍝§11§Fácil§macarrão¤manteiga¤queijo¤sal§Cozinhe macarrão.¦Derreta manteiga e misture.¦Finalize com queijo.§almoço~20§Tomate Recheado Express§🍅§12§Médio§tomate¤queijo¤ovo¤orégano¤sal§Cave tomates.¦Recheie com queijo e ovo.¦Leve ao forno 10 min.§almoço~21§Torrada com Abacate§🥑§5§Fácil§pão¤abacate¤limão¤sal¤azeite§Toste pão.¦Amasse abacate com limão e sal.¦Espalhe e regue azeite.§café¤fit~22§Omelete de Tomate§🍅§8§Fácil§ovo¤tomate¤cebola¤sal¤óleo§Refogue cebola e tomate.¦Despeje ovos batidos.¦Dobre e sirva.§café~23§Queijadinha de Frigideira§🥧§10§Médio§ovo¤queijo¤leite condensado¤coco§Misture tudo.¦Frite colheradas.¦Doure dos dois lados.§doce~24§Cappuccino de Micro§☕§4§Fácil§leite¤café¤açúcar¤canela§Aqueça leite.¦Bata com café e açúcar.¦Polvilhe canela.§bebida~25§Banana com Canela§🍌§5§Fácil§banana¤canela¤açúcar¤manteiga§Fatie banana.¦Doure na manteiga.¦Polvilhe canela e açúcar.§doce¤café~26§Tostex de Atum§🐟§9§Fácil§pão¤atum¤maionese¤queijo§Misture atum com maionese.¦Recheie pão com queijo.¦Toste bem.§lanche~27§Salada de Tomate e Queijo§🥗§6§Fácil§tomate¤queijo¤azeite¤manjericão¤sal§Fatie tomate e queijo.¦Tempere com azeite e sal.¦Finalize com manjericão.§salada~28§Pão de Alho Caseiro§🧄§12§Fácil§pão¤alho¤manteiga¤queijo¤salsa§Misture alho com manteiga e salsa.¦Espalhe no pão com queijo.¦Leve ao forno 8 min.§lanche~29§Arroz Doce de Caneca§🍚§10§Fácil§arroz¤leite¤açúcar¤canela§Cozinhe arroz com leite na caneca no micro.¦Adoce.¦Polvilhe canela.§doce~30§Wrap de Ovo§🌯§7§Fácil§ovo¤pão folha¤queijo¤tomate¤alface§Faça omelete fina.¦Monte wrap com salada e queijo.¦Enrole e corte.§lanche¤fit~31§Batata Sauté Rapidinha§🥔§13§Médio§batata¤manteiga¤alho¤sal¤salsa§Cozinhe batata em cubos 5 min.¦Sauté na manteiga com alho.¦Finalize com salsa.§acompanhamento~32§Queijo Coalho na Frigideira§🧀§5§Fácil§queijo coalho¤manteiga¤orégano§Corte queijo em fatias grossas.¦Doure na manteiga.¦Polvilhe orégano.§lanche~33§Mingau de Aveia§🥣§6§Fácil§leite¤aveia¤açúcar¤canela§Aqueça leite com aveia.¦Mexa até engrossar.¦Adoce e polvilhe canela.§café~34§Bolinho de Arroz§🍘§15§Médio§arroz¤ovo¤queijo¤farinha¤óleo§Misture arroz, ovo e queijo.¦Modele bolinhos.¦Frite em óleo quente.§lanche~35§Espaguete de Abobrinha§🥒§10§Médio§abobrinha¤alho¤azeite¤queijo¤sal§Fatie abobrinha em tirinhas.¦Refogue com alho e azeite.¦Finalize com queijo.§fit¤almoço~36§Pão com Manteiga e Ovo§🍳§6§Fácil§pão¤manteiga¤ovo¤sal§Toste pão.¦Frite ovo.¦Monte.§café~37§Salpicão de Frango Rápido§🥗§12§Fácil§frango¤maionese¤milho¤cenoura¤batata palha§Desfie frango.¦Misture com maionese, milho e cenoura.¦Cubra com batata palha.§almoço~38§Tapioca de Leite Condensado§🥞§5§Fácil§tapioca¤leite condensado¤coco§Aqueça tapioca.¦Recheie com leite condensado e coco.¦Dobre.§doce~39§Café Cremoso Gelado§🧊§4§Fácil§café¤leite¤açúcar¤gelo§Bata café com açúcar até creme.¦Misture leite e gelo.¦Sirva.§bebida~40§Ovo no Micro com Queijo§🍳§3§Fácil§ovo¤queijo¤sal¤manteiga§Unte caneca com manteiga.¦Quebre ovo, fure gema, cubra com queijo.¦Micro 1 min.§rápido¤café",RECIPES=DATA.split('~').map(x=>{const [id,nome,emoji,min,dif,ings,steps,tags]=x.split('§');return{id:+id,nome,emoji,minutos:+min,tempo:min+' min',dificuldade:dif,ingredientes:ings.split('¤'),passos:steps.split('¦'),tags:tags.split('¤')}}),norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const parseIng=t=>[...new Set(norm(t).replace(/^(oi|ola|eai|hey|oie)\b[\s,!]*/,'').replace(/^(tenho|tenho so|tenho aqui|tenho em casa|sobrou)\s*/,'').split(/,|\s+e\s+|\s+com\s+|\s+mais\s+|;|\+/).map(x=>x.trim()).filter(x=>x.length>1&&!['aqui','casa','geladeira','ingrediente','coisa','pouco','muita'].includes(x)))];
const search=ings=>{const set=ings.map(norm);return RECIPES.map(r=>{let match=0;for(const n of r.ingredientes.map(norm))if(set.some(f=>f===n||f.includes(n)||n.includes(f)))match++;const score=match/r.ingredientes.length;const faltantes=r.ingredientes.filter(x=>!set.some(f=>{const n=norm(x);return f===n||f.includes(n)||n.includes(f)}));return{...r,match,score,faltantes}}).filter(r=>r.match>0).sort((a,b)=>b.score-a.score||b.match-a.match||a.minutos-b.minutos).slice(0,3)};
const chat=document.querySelector('#chat'),input=document.querySelector('#input'),bar=document.querySelector('#bar'),status=document.querySelector('#aiStatus'),backend=document.querySelector('#backend'),favCount=document.querySelector('#favCount');let fav=JSON.parse(localStorage.getItem('chefe-bot-fav')||'{}'),generator=null,loading=null;
const updateFav=()=>favCount.textContent=Object.values(fav).filter(Boolean).length+' ♥';const add=(role,text,rs=[])=>{const m=document.createElement('div');m.className='message '+role;const b=document.createElement('div');b.className='bubble';b.textContent=text;m.append(b);rs.forEach(r=>m.append(card(r)));chat.append(m);chat.scrollTop=chat.scrollHeight};
const card=r=>{const a=document.createElement('article');a.className='recipe';a.innerHTML='<div class="emoji">'+r.emoji+'</div><div class="recipe-main"><h3></h3><div class="meta"></div><div class="ing-list"></div><div class="actions"></div><ol class="steps" hidden></ol></div>';a.querySelector('h3').textContent=r.nome;a.querySelector('.meta').textContent='⏱ '+r.tempo+' · '+r.dificuldade+' · '+r.match+'/'+r.ingredientes.length;a.querySelector('.ing-list').innerHTML=r.ingredientes.map(x=>'<span class="ing '+(r.faltantes.includes(x)?'miss':'')+'">'+(r.faltantes.includes(x)?'○':'✓')+' '+x+'</span>').join('');const act=a.querySelector('.actions'),see=document.createElement('button');see.className='primary';see.textContent='Ver modo de preparo';see.onclick=()=>{const s=a.querySelector('.steps');s.hidden=!s.hidden;see.textContent=s.hidden?'Ver modo de preparo':'Esconder preparo'};const h=document.createElement('button');h.className='heart';h.textContent=fav[r.id]?'♥':'♡';h.onclick=()=>{fav[r.id]=!fav[r.id];localStorage.setItem('chefe-bot-fav',JSON.stringify(fav));h.textContent=fav[r.id]?'♥':'♡';updateFav()};act.append(see,h);a.querySelector('.steps').innerHTML=r.passos.map(x=>'<li>'+x+'</li>').join('');return a};
updateFav();document.querySelector('#chips').innerHTML=['ovo','queijo','pão','tomate','arroz','manteiga','leite','macarrão'].map(x=>'<button data-i="'+x+'">'+x+'</button>').join('');document.querySelector('#chips').onclick=e=>{if(e.target.dataset.i)input.value=input.value?input.value+', '+e.target.dataset.i:e.target.dataset.i;input.focus()};add('bot','Olá! Eu sou o Chef-Bot. Diga os ingredientes que você tem e eu procuro receitas para você.');
const MODEL='onnx-community/SmolLM2-135M-Instruct-ONNX-MHA',SYSTEM='Você é um roteador de intenções de um aplicativo de receitas. Responda somente JSON válido. Esquema: {"action":"SEARCH_RECIPE|SHOW_RECIPE|FAVORITE_RECIPE|CLEAR_CHAT|HELP|GREETING|UNKNOWN","ingredients":[],"recipe":""}. Para ingredientes, use palavras curtas em português.';
const extractJSON=t=>{const s=String(t).trim(),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw Error('JSON ausente');return JSON.parse(s.slice(a,b+1))};const validate=x=>{const ok=new Set(['SEARCH_RECIPE','SHOW_RECIPE','FAVORITE_RECIPE','CLEAR_CHAT','HELP','GREETING','UNKNOWN']);if(!x||typeof x!=='object'||!ok.has(x.action))throw Error('Ação inválida');return{action:x.action,ingredients:Array.isArray(x.ingredients)?x.ingredients.filter(v=>typeof v==='string').slice(0,10):[],recipe:typeof x.recipe==='string'?x.recipe.slice(0,120):''}};
async function loadAI(){if(generator||loading)return;loading=(async()=>{try{status.textContent='Baixando/carregando modelo local...';const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1');env.useBrowserCache=true;env.allowRemoteModels=true;try{generator=await pipeline('text-generation',MODEL,{device:'webgpu',dtype:'q4f16',progress_callback:p=>{if(p?.status==='progress'&&p.total)bar.style.width=Math.max(0,Math.min(100,p.progress||0))+'%'}});backend.textContent='WebGPU';}catch{generator=await pipeline('text-generation',MODEL,{device:'wasm',dtype:'q4',progress_callback:p=>{if(p?.status==='progress'&&p.total)bar.style.width=Math.max(0,Math.min(100,p.progress||0))+'%'}});backend.textContent='WASM'}bar.style.width='100%';status.textContent='IA local ativa';document.querySelector('#loadAI').disabled=true}catch(e){status.textContent='IA local indisponível; busca local continua ativa';backend.textContent=e.message||'erro'}})().finally(()=>loading=null)};
async function route(t){if(!generator)return null;const out=await generator([{role:'system',content:SYSTEM},{role:'user',content:t}],{max_new_tokens:80,do_sample:false,return_full_text:false});const g=out?.[0]?.generated_text,z=Array.isArray(g)?g.at(-1)?.content||'':String(g||'');return validate(extractJSON(z))}
const find=r=>{const q=norm(r);return RECIPES.find(x=>String(x.id)===q||norm(x.nome)===q||norm(x.nome).includes(q))};
async function send(){const t=input.value.trim();if(!t)return;input.value='';add('user',t);let a=null;try{a=await route(t)}catch{}if(!a)a={action:'SEARCH_RECIPE',ingredients:parseIng(t)}if(a.action==='GREETING'){add('bot','Olá! Posso procurar receitas pelos ingredientes que você tem.');return}if(a.action==='HELP'){add('bot','Diga os ingredientes que você tem, por exemplo: tenho ovo, queijo e pão.');return}if(a.action==='CLEAR_CHAT'){chat.innerHTML='';add('bot','Conversa limpa. O Chef-Bot está pronto.');return}if(a.action==='SHOW_RECIPE'||a.action==='FAVORITE_RECIPE'){const r=find(a.recipe);if(!r){add('bot','Não encontrei essa receita.');return}if(a.action==='FAVORITE_RECIPE'){fav[r.id]=true;localStorage.setItem('chefe-bot-fav',JSON.stringify(fav));updateFav();add('bot',r.nome+' foi adicionado aos favoritos.')}else add('bot','Encontrei a receita: '+r.nome,[{...r,match:r.ingredientes.length,faltantes:[]}]);return}const ings=a.ingredients?.length?a.ingredients:parseIng(t),rs=search(ings);rs.length?add('bot','Achei '+rs.length+' receita(s) compatíveis:',rs):add('bot','Não encontrei uma combinação suficiente. Tente adicionar mais ingredientes.')}
document.querySelector('#send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};document.querySelector('#loadAI').onclick=loadAI;if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
